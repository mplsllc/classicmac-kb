[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "classicmac-kb-tools"
version = "0.1.0"
description = "Validation and SQLite indexing tools for the ClassicMac knowledge base"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
classicmac-kb-build = "classicmac_kb_tools.build_all:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classicmac_kb_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

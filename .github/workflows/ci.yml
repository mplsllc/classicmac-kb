name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout knowledge base
        uses: actions/checkout@v4
        with:
          path: classicmac-kb

      - name: Checkout MacSurf full history
        uses: actions/checkout@v4
        with:
          repository: mplsllc/macsurf
          fetch-depth: 0
          path: sources/macsurf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: classicmac-kb
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        working-directory: classicmac-kb
        run: pytest -q

      - name: Build canonical plus public first-party evidence indexes
        working-directory: classicmac-kb
        shell: bash
        run: |
          set -o pipefail
          classicmac-kb-build \
            --git-repo mplsllc/macsurf="$GITHUB_WORKSPACE/sources/macsurf" \
            --document-repo mplsllc/macsurf="$GITHUB_WORKSPACE/sources/macsurf" \
            2>&1 | tee build-index.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classicmac-kb-build-diagnostics
          path: classicmac-kb/build-index.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify indexed corpus
        working-directory: classicmac-kb
        run: |
          python - <<'PY'
          import json
          import sqlite3

          db = sqlite3.connect("build/classicmac.sqlite")
          knowledge = db.execute("select count(*) from knowledge").fetchone()[0]
          sources = db.execute("select count(*) from sources").fetchone()[0]
          macsurf = db.execute(
              "select count(*) from git_commits where repository='mplsllc/macsurf'"
          ).fetchone()[0]
          documents = db.execute("select count(*) from documents").fetchone()[0]
          print({
              "knowledge": knowledge,
              "sources": sources,
              "macsurf_commits": macsurf,
              "documents": documents,
          })
          assert knowledge > 0
          assert sources > 0
          assert macsurf > 0
          assert documents > 0
          assert db.execute(
              "select sha from git_fts where git_fts match 'CodeWarrior' limit 1"
          ).fetchone() is not None
          assert db.execute(
              "select path from document_fts where document_fts match 'CodeWarrior' limit 1"
          ).fetchone() is not None

          row = db.execute(
              "select metadata_json from source_metadata "
              "where source_id='metrowerks-ide-sdk-api-reference-5-1'"
          ).fetchone()
          assert row is not None
          metadata = json.loads(row[0])
          assert metadata["revision"] == "2003-08-25"
          assert metadata["applicability"]["codewarrior_8_3"] == "unverified"
          assert [part["order"] for part in metadata["parts"]] == [1, 2]
          assert [part["path"] for part in metadata["parts"]] == [
              "books/text/SDKAPIRM.txt",
              "books/text/SDKAPIRM2.txt",
          ]
          PY

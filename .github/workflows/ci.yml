name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout knowledge base
        uses: actions/checkout@v4
        with:
          path: classicmac-kb

      - name: Checkout MacSurf full history
        uses: actions/checkout@v4
        with:
          repository: mplsllc/macsurf
          fetch-depth: 0
          path: sources/macsurf

      - name: Checkout workflow full history
        uses: actions/checkout@v4
        with:
          repository: mplsllc/workflow
          fetch-depth: 0
          path: sources/workflow

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: classicmac-kb
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        working-directory: classicmac-kb
        run: pytest -q

      - name: Build canonical plus first-party evidence indexes
        working-directory: classicmac-kb
        run: |
          classicmac-kb-build \
            --git-repo mplsllc/macsurf="$GITHUB_WORKSPACE/sources/macsurf" \
            --git-repo mplsllc/workflow="$GITHUB_WORKSPACE/sources/workflow" \
            --document-repo mplsllc/macsurf="$GITHUB_WORKSPACE/sources/macsurf" \
            --document-repo mplsllc/workflow="$GITHUB_WORKSPACE/sources/workflow"

      - name: Verify indexed corpus
        working-directory: classicmac-kb
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("build/classicmac.sqlite")
          knowledge = db.execute("select count(*) from knowledge").fetchone()[0]
          sources = db.execute("select count(*) from sources").fetchone()[0]
          macsurf = db.execute(
              "select count(*) from git_commits where repository='mplsllc/macsurf'"
          ).fetchone()[0]
          workflow = db.execute(
              "select count(*) from git_commits where repository='mplsllc/workflow'"
          ).fetchone()[0]
          documents = db.execute("select count(*) from documents").fetchone()[0]
          print({
              "knowledge": knowledge,
              "sources": sources,
              "macsurf_commits": macsurf,
              "workflow_commits": workflow,
              "documents": documents,
          })
          assert knowledge > 0
          assert sources > 0
          assert macsurf > 0
          assert workflow > 0
          assert documents > 0
          assert db.execute(
              "select sha from git_fts where git_fts match 'CodeWarrior' limit 1"
          ).fetchone() is not None
          assert db.execute(
              "select path from document_fts where document_fts match 'CodeWarrior' limit 1"
          ).fetchone() is not None
          PY

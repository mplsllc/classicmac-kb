  - id: cw8.8.3.dictionary-entry-not-behavior-proof
    title: CodeWarrior dictionary presence is not proof an operation works
    scope: toolchain
    state: decision
    validation_level: codewarrior_verified
    statement: An operation or property appearing in CodeWarrior's installed AETE dictionary is classified as discovered/documented, not verified. Promotion to verified requires a controlled probe with an observable postcondition and preserved failure behavior.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      notes: This is the governing evidence policy for the first-party CW8.3 catalog.
    evidence:
      - {source_id: workflow.dictionary-discovery, role: origin}
      - {source_id: workflow.capability-coverage, role: supports}
      - {source_id: workflow.capability-matrix.cw8-8.3, role: supports}
    tags: [codewarrior, aete, appleevent, evidence, capability-discovery]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.errors-window-text-export
    title: CodeWarrior Errors & Warnings text export is the primary build diagnostic
    scope: toolchain
    state: verified
    validation_level: hardware_verified
    statement: `Save Error Window As` is verified on the target and produces retrievable plain-text compiler/linker diagnostics. Build automation should preserve that text and stop before launch or packaging on blocking diagnostics instead of relying primarily on screenshots.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
      notes: A short HFS-safe temporary leaf name is required because the legacy alias conversion rejected a long generated filename with error -37 even though Tiger permits it at the filesystem layer.
    evidence:
      - {source_id: workflow.build-diagnostics, role: origin}
    tags: [codewarrior, diagnostics, compiler-errors, linker-errors, evidence]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.no-standalone-cli-installed
    title: Current iMac has no installed standalone CodeWarrior compiler CLI
    scope: machine
    state: verified
    validation_level: hardware_verified
    statement: The tested iMac environment has no installed `cwctl`, `mwcc`, `mwld`, `ToolServer`, or `toolserver` executable available as a standalone command-line build path. The `MW C-C++ PPC` and linker items in the CodeWarrior installation are IDE plug-ins and must not be treated as Unix compiler drivers.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      machines: [imac-g3-tiger]
      notes: This describes the current machine inventory, not every CodeWarrior installation.
    evidence:
      - {source_id: workflow.cli-audit.cw8-8.3, role: origin}
    tags: [codewarrior, cli, toolserver, compiler-plugin, machine-inventory]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.xml-import-gui-verified
    title: CodeWarrior XML to native MCP import is hardware verified through GUI automation
    scope: machine
    state: verified
    validation_level: hardware_verified
    statement: The tested environment can create a native `.mcp` project by driving `File > Import Project…` through GUI automation. The XML file requires the expected HFS metadata (TEXT/CWIE) before import. This is the verified project-bootstrap path where direct AppleEvent support is absent.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
    evidence:
      - {source_id: workflow.capability-coverage, role: supports}
      - {source_id: workflow.capability-matrix.cw8-8.3, role: supports}
    tags: [codewarrior, xml, mcp, project-import, gui-automation, hfs-metadata]
    last_reviewed: "2026-09-16"

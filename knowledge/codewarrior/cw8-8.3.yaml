records:
  - id: cw8.8.3.update-project-is-bring-up-to-date
    title: Update Project is the verified Bring Up To Date operation
    scope: toolchain
    state: verified
    validation_level: hardware_verified
    statement: On the tested CodeWarrior Pro 8.3 environment, the AppleEvent command `Update Project` is the verified project-aware Bring Up To Date build operation. `Run project document 1` is a launch operation and must not be used as a substitute when the application is already running.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
      notes: Verified against the current first-party remote build environment; other CodeWarrior releases require their own capability record.
    evidence:
      - {source_id: workflow.automation-model, role: supports}
      - {source_id: workflow.capability-matrix.cw8-8.3, role: supports}
    tags: [codewarrior, appleevent, build, update-project, bring-up-to-date]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.run-is-launch
    title: Run is a launch operation, not the authoritative build gate
    scope: toolchain
    state: verified
    validation_level: hardware_verified
    statement: `Run project document 1` launches the active CodeWarrior project. The safe automated sequence performs Update Project, checks live diagnostics and output identity, then invokes Run and confirms the intended application process starts.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
    evidence:
      - {source_id: workflow.automation-model, role: supports}
      - {source_id: workflow.capability-matrix.cw8-8.3, role: supports}
    tags: [codewarrior, launch, run, build-pipeline]
    related: [cw8.8.3.update-project-is-bring-up-to-date]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.appleevent-timeout-build-continues
    title: AppleEvent timeout does not prove a long CodeWarrior build stopped
    scope: toolchain
    state: verified
    validation_level: hardware_verified
    statement: A large CodeWarrior build can exceed the default AppleEvent timeout and return error -1712 while CodeWarrior continues building. Automation must treat timeout as ambiguous state, query process/project state before retrying, and use an explicit long timeout for known long builds.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
      notes: Observed with a roughly 925-file rebuild; the principle that timeout does not prove cancellation is also retained as a workflow record.
    evidence:
      - {source_id: macsurf.commit.379281f004219895423bb9e059c4ac1a944573c5, role: origin}
      - {source_id: workflow.operational-discipline, role: supports}
    tags: [codewarrior, appleevent, timeout, build, recovery]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.add-files-noerr-no-effect
    title: Direct Add Files AppleEvent is broken on the tested Tiger target
    scope: machine
    state: incompatible
    validation_level: hardware_verified
    statement: On the tested Tiger-hosted CodeWarrior 8.3 installation, direct Add Files AppleEvent forms returned success/noErr yet changed neither project file count nor the project on disk. GUI `Project > Add Files…` is the verified fallback for adding files.
    applicability:
      toolchain_family: codewarrior
      toolchain_versions: ["8.3"]
      os_family: mac-os-x
      os_versions: ["10.4.11"]
      machines: [imac-g3-tiger]
      notes: Do not generalize this failure to all CodeWarrior/OS combinations without testing.
    evidence:
      - {source_id: macsurf.commit.36160dbda1cbe6ae5981377a5ba2bf3ce2113c02, role: origin}
      - {source_id: macsurf.commit.4c48b04cbce9266f8c5cf5218cbb80912d903a5e, role: supports}
      - {source_id: workflow.capability-matrix.cw8-8.3, role: supports}
    tags: [codewarrior, appleevent, project-membership, add-files, tiger, gui-fallback]
    last_reviewed: "2026-09-16"

  - id: cw8.8.3.remove-files-verified
